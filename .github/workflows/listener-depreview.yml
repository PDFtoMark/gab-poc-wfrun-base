name: Listener Dependency Review
on:
  workflow_run:
    workflows: ["PR Workflow"]
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  check:
    if: |
      !github.event.repository.private &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Consume attacker artifact exactly as target workflow does
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: download-and-submit
      - name: Show what the privileged job obtained from the fork run
        if: always()
        run: |
          echo "TRIGGERED-DEPREVIEW-LISTENER"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          find . -maxdepth 3 -type f -print | sort
          for f in $(find . -maxdepth 3 -name '*.json'); do echo "--- FILE: $f"; cat "$f"; done
